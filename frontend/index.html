<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAFB" media="(prefers-color-scheme: light)" />
    <title>Ledger</title>

    <!--
      THEME BOOT SCRIPT — must run before first paint, inlined here on purpose.

      If the theme is resolved inside React, the browser has already painted the
      default background and you get a white flash in dark mode on every reload.
      This reads localStorage, falls back to the OS preference, and stamps
      `data-theme` on <html> before the body renders.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ledger-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
